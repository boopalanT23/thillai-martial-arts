<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Radial Navy Theme Gradient -->
    <radialGradient id="navyCrestBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E4472" />
      <stop offset="60%" stop-color="#112D4E" />
      <stop offset="100%" stop-color="#0A192B" />
    </radialGradient>
    <!-- Gold Gradient for Outer Ring -->
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <!-- Drop shadow for elevation -->
    <filter id="crestShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Circular Badge -->
  <circle cx="120" cy="120" r="114" fill="url(#navyCrestBg)" filter="url(#crestShadow)" />
  
  <!-- Outer Championship Gold Ring -->
  <circle cx="120" cy="120" r="114" fill="none" stroke="url(#goldRing)" stroke-width="3" />
  
  <!-- Secondary Athletic Blue Ring -->
  <circle cx="120" cy="120" r="110.5" fill="none" stroke="#3F72AF" stroke-width="2.5" />
  
  <!-- Subtle Inner Accent Ring -->
  <circle cx="120" cy="120" r="106.5" fill="none" stroke="#DBE2EF" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Outer Triangle: Pure White -->
  <polygon 
    points="120,42 44,172 196,172" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="4.2" 
    stroke-linejoin="round"
  />

  <!-- Inner Concentric Triangle: Athletic Cyan/Ice-Blue -->
  <polygon 
    points="120,54 54,165.5 186,165.5" 
    fill="none" 
    stroke="#93C5FD" 
    stroke-width="2.4" 
    stroke-linejoin="round"
  />

  <!-- Authentic Serif T Emblem -->
  <!-- Handcrafted with matching down-curved bracket serifs and wide flared base -->
  <path d="
    M 88,102 
    L 152,102 
    C 152,102 153.5,108 153.5,116 
    C 153.5,120 151,121 148,121 
    C 145,121 144,118 144,113 
    C 144,110 142.5,109 138,109 
    C 134,109 131,109.5 129,112 
    C 127.5,114 127,117 127,122 
    L 127,150 
    C 127,153 129,155 133,155.5 
    C 137,156 142,156 142,156 
    L 142,162 
    L 98,162 
    L 98,156 
    C 98,156 103,156 107,155.5 
    C 111,155 113,153 113,150 
    L 113,122 
    C 113,117 112.5,114 111,112 
    C 109,109.5 106,109 102,109 
    C 97.5,109 96,110 96,113 
    C 96,118 95,121 92,121 
    C 89,121 86.5,120 86.5,116 
    C 86.5,108 88,102 88,102 
    Z
  " fill="#FFFFFF" />
</svg>