# ──────────────────────────────────────────────────────────────
# THILLAI MARTIAL ARTS CLUB — Backend Configuration
# Copy real secrets into environment variables in production;
# the ${VAR:default} syntax below falls back to dev-friendly
# defaults so the app boots locally with minimal setup.
# ──────────────────────────────────────────────────────────────

spring.application.name=thillai-martial-arts

# ── Server ───────────────────────────────────────────────────
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# ── Database (MySQL) ────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:thillai_martial_arts}?useSSL=${DB_SSL:false}&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false} 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────
# IMPORTANT: override jwt.secret via env var in production (min 256-bit / 32-char random string)
jwt.secret=${JWT_SECRET:ThillaiMartialArtsClubSuperSecretSigningKeyChangeThisInProduction2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}

# ── File Upload ──────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
app.upload.base-dir=${UPLOAD_DIR:src/main/resources/static/uploads}
app.upload.public-url-prefix=/uploads

# ── Razorpay ─────────────────────────────────────────────────
razorpay.key-id=rzp_test_TRvwtcq8ykZpwb
razorpay.key-secret=nAGsk45BzcreDZ2Vo5pbS6lf

# ── Mail (Gmail SMTP example — use an App Password, not your real password) ──
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:hartzone1974@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_gmail_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:hartzone1974@gmail.com}
app.mail.club-name=THILLAI MARTIAL ARTS CLUB

# ── Google Maps (used only if backend ever needs server-side geocoding) ──
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# ── Admin bootstrap (created by DataInitializer on first run) ──
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-password=${ADMIN_PASSWORD:Admin@123}
app.admin.default-email=${ADMIN_EMAIL:hartzone1974@gmail.com}

# ── Business rules ───────────────────────────────────────────
app.fee.per-course=300

# ── Swagger / OpenAPI ────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ──────────────────────────────────────────────────
logging.level.com.thillai.martialarts=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:TRACE} 
